services:
  backend:
    build:
      context: ./backend
    container_name: clearmail-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./frontend
    container_name: clearmail-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend